# ============================================================
# Alembic — configuración de migraciones
#
# La URL de la base NO se pone acá a propósito: la lee migrations/env.py desde
# la variable de entorno DATABASE_URL (la misma que usa la app). Así no hay
# riesgo de commitear credenciales ni de migrar la base equivocada.
# ============================================================

[alembic]
script_location = migrations

# Los archivos de migración se nombran: 20260818_1930-a1b2c3d4_descripcion.py
# El prefijo por fecha hace que se lean en orden en el explorador de archivos.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = .
timezone = America/Argentina/Buenos_Aires

[post_write_hooks]
# Sin hooks de formateo por ahora.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
